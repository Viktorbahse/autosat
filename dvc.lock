schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox "37.38132,55.88128,37.52346,55.95035"
      data/central-fed-district-latest.osm.pbf --output data/map.osm.pbf
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.38132
        - 55.88128
        - 37.52346
        - 55.95035
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: 6330686fcc04095372529ceb58dd5081
      size: 857809422
    - path: data/map.osm.pbf
      hash: md5
      md5: 53b2e331ab82b9813f03d2a49f3e2efa
      size: 2536326
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.38132
          - 55.88128
          - 37.52346
          - 55.95035
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: 6833b9b8ca005b7a39bb1991b88b583a.dir
      size: 133855997
      nfiles: 100
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.38132
          - 55.88128
          - 37.52346
          - 55.95035
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/dataset
      hash: md5
      md5: 09080b92a422cc59bb6801791fc73b3e.dir
      size: 1838432160
      nfiles: 20
  training:
    cmd: python src/training.py
    params:
      params.yaml:
        training:
          random_seed: 42
          dataset_dir: ${prepare_dataset.dataset_dir}
          dataset_split:
            train: 0.7
            val: 0.15
            test: 0.15
          obj_class: road
          max_workers: 4
          compute_class_balance: true
