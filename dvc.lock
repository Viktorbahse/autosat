schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox "37.37411,55.63187,37.60483,55.74006"
      data/central-fed-district-latest.osm.pbf --output data/map.osm.pbf
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.37411
        - 55.63187
        - 37.60483
        - 55.74006
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: ad9b04a8e07e904fa232d1f48ebaaee2
      size: 858465154
    - path: data/map.osm.pbf
      hash: md5
      md5: 67e4196db5425da2b05fc8c446dbb28b
      size: 9654251
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 36.9
          - 55.38
          - 38.0
          - 56.0
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: daaf3ec14030c7ccb5e61d6791e1b313.dir
      size: 9841615899
      nfiles: 8006
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 36.9
          - 55.38
          - 38.0
          - 56.0
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/dataset
      hash: md5
      md5: f2b584c8339a13f01aebb6eb36607627.dir
      size: 147074803200
      nfiles: 1600
  training:
    cmd: python src/train.py
    deps:
    - path: data/dataset
      hash: md5
      md5: f2b584c8339a13f01aebb6eb36607627.dir
      size: 147074803200
      nfiles: 1600
    params:
      params.yaml:
        training:
          random_seed: 42
          checkpoint_dir: data/checkpoint
          classes: ${prepare_satellite_data.classes}
          num_epoch: 25
          loader:
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.7
            val_ratio: 0.15
            test_ratio: 0.15
            batch_size: 32
            num_workers: 4
            image_size: 512
          model:
            loss: mIoU
            metric: mcc
            cuda: true
            num_classes: 3
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.01
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
