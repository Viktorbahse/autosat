schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: "wget -c --limit-rate=10M -P data/  \"https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf\"\
      \ && osmium extract --bbox  \"37.53891,55.71241,37.57925,55.73339\" data/central-fed-district-latest.osm.pbf\
      \  --output data/map.osm.pbf\n"
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.53891
        - 55.71241
        - 37.57925
        - 55.73339
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: fe85a383ea5f256e40f7490ab46838b6
      size: 864795295
    - path: data/map.osm.pbf
      hash: md5
      md5: 00379adbde79f15d75a8d955d1820813
      size: 659941
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    deps:
    - path: data/map.osm.pbf
      hash: md5
      md5: 00379adbde79f15d75a8d955d1820813
      size: 659941
    - path: scripts/prepare_satellite_data.py
      hash: md5
      md5: 237bb72d245b2c6d292cfda5651961dd
      size: 13155
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 153
          data_dir: data/satellite
          max_workers: 8
          zoom: 19
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.53891
          - 55.71241
          - 37.57925
          - 55.73339
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: a8846856ac45f93ec71a456186f69427.dir
      size: 101166663
      nfiles: 125
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    deps:
    - path: data/satellite
      hash: md5
      md5: a8846856ac45f93ec71a456186f69427.dir
      size: 101166663
      nfiles: 125
    - path: scripts/prepare_dataset.py
      hash: md5
      md5: 94d89c905534cfacab90941368508c8a
      size: 3671
    params:
      params.yaml:
        prepare_dataset:
          satellite_dir:
            ${prepare_satellite_data.data_dir}/${prepare_satellite_data.zoom}
          dataset_dir: ${prepare_satellite_data.dataset_dir}
          max_workers: 8
          num_tiles: ${prepare_satellite_data.num_tiles}
          tile_size: ${prepare_satellite_data.tile_size}
          classes: ${prepare_satellite_data.classes}
          zoom: ${prepare_satellite_data.zoom}
    outs:
    - path: data/dataset
      hash: md5
      md5: 76214e3d61f1376ca613cd562463bab6.dir
      size: 2298043800
      nfiles: 25
  training:
    cmd: python src/train.py
    deps:
    - path: data/dataset
      hash: md5
      md5: b154b7d8660a45272ee043eb1c2eb2ac.dir
      size: 2298044630
      nfiles: 26
    - path: src/loader.py
      hash: md5
      md5: 2de0e7ae01cefd6214247e96d3828ca2
      size: 7243
    - path: src/train.py
      hash: md5
      md5: f25f613c2e9e488954557b5379a78c53
      size: 1524
    params:
      params.yaml:
        training:
          random_seed: 42
          logs_dir: data/logs
          classes: ${prepare_satellite_data.classes}
          num_epoch: 1
          loader:
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.7
            val_ratio: 0.15
            test_ratio: 0.15
            keep_split: data/dataset/data_split_flags.json
            batch_size: 2
            num_workers: 8
            image_size: 256
          model:
            loss: mIoU
            metric: miou
            cuda: true
            num_classes: 3
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.0001
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
    outs:
    - path: data/logs/DvcLiveLogger/model_training/checkpoints/
      hash: md5
      md5: 2777ea6c8741dc3ec89466616314e337.dir
      size: 456777324
      nfiles: 1
    - path: data/logs/dvclive/artifacts/
      hash: md5
      md5: 2777ea6c8741dc3ec89466616314e337.dir
      size: 456777324
      nfiles: 1
    - path: data/logs/dvclive/metrics.json
      hash: md5
      md5: d2efaaa9f93e30120bb80581561bdb58
      size: 269
    - path: data/logs/dvclive/plots/metrics
      hash: md5
      md5: 59f4c14150d5f9493e06161bac9ac3e5.dir
      size: 189
      nfiles: 6
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - path: data/dataset/data_split_flags.json
      hash: md5
      md5: 486a0f505b7a5bfeaa5f8a8666a916a6
      size: 830
    - path: data/logs/DvcLiveLogger/model_training/checkpoints/
      hash: md5
      md5: 2777ea6c8741dc3ec89466616314e337.dir
      size: 456777324
      nfiles: 1
    - path: src/evaluate.py
      hash: md5
      md5: bc1bab25a1b96b790e807c41e6cf1349
      size: 4408
