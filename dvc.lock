schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox "37.35901,55.55971,37.83417,55.89072"
      data/central-fed-district-latest.osm.pbf --output data/map.osm.pbf
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.35901
        - 55.55971
        - 37.83417
        - 55.89072
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: 3b9c97248fd5024ef93dec4e55977c7b
      size: 860250819
    - path: data/map.osm.pbf
      hash: md5
      md5: 5d13ee5a9f2691634a57e7ed940a2b05
      size: 63055829
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 153
          data_dir: data/satellite
          max_workers: 4
          zoom: 19
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.51093
          - 55.66074
          - 37.59333
          - 55.69994
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: 3f798ba43bb94554287437d9b6e98f62.dir
      size: 495326333
      nfiles: 600
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 153
          data_dir: data/satellite
          max_workers: 4
          zoom: 19
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.51093
          - 55.66074
          - 37.59333
          - 55.69994
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/dataset
      hash: md5
      md5: 80089f2c31be71c94394c38adf825678.dir
      size: 11030610240
      nfiles: 120
  training:
    cmd: python src/train.py
    params:
      params.yaml:
        training:
          random_seed: 42
          logs_dir: data/logs
          classes: ${prepare_satellite_data.classes}
          num_epoch: 3
          loader:
            version: 1
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.5
            val_ratio: 0.25
            test_ratio: 0.25
            batch_size: 1
            num_workers: 4
            image_size: 256
          model:
            loss: mIoU
            metric: mcc
            cuda: true
            num_classes: 3
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.01
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
          predict_on_test_data: true
