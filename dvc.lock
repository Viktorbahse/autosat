schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox "37.56,55.715,38.0,56.35"
      data/central-fed-district-latest.osm.pbf --output data/map.osm.pbf
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.56
        - 55.715
        - 38.0
        - 56.35
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: 5cd1b40463dce690b39058a9ac47a250
      size: 859343987
    - path: data/map.osm.pbf
      hash: md5
      md5: 7b0079f087f41eb38d7df3c7c7b856fa
      size: 45108062
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 12
          zoom: 17
          num_tiles: 30
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.56
          - 55.715
          - 38.0
          - 56.35
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: 678d4cf733b475bbb31bd6dbe5263fb0.dir
      size: 3509193901
      nfiles: 325
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 204
          data_dir: data/satellite
          max_workers: 12
          zoom: 17
          num_tiles: 30
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.56
          - 55.715
          - 38.0
          - 56.35
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/dataset
      hash: md5
      md5: 932b120f706dc996f97bb00c12b089e3.dir
      size: 49864719320
      nfiles: 65
  training:
    cmd: python src/train.py
    deps:
    - path: data/dataset
      hash: md5
      md5: cc44718fa5f139f5b873b24a26230684.dir
      size: 459607520
      nfiles: 20
    params:
      params.yaml:
        training:
          random_seed: 42
          logs_dir: data/logs
          classes: ${prepare_satellite_data.classes}
          num_epoch: 5
          loader:
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.7
            val_ratio: 0.15
            test_ratio: 0.15
            batch_size: 1
            num_workers: 4
            image_size: 256
          model:
            loss: mIoU
            metric: mcc
            cuda: true
            num_classes: 3
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.01
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
