schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox "37.4769,55.62708,37.65942,55.704"
      data/central-fed-district-latest.osm.pbf --output data/map.osm.pbf
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.4769
        - 55.62708
        - 37.65942
        - 55.704
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: e76b8a066831476c1060043e038e0de2
      size: 858392544
    - path: data/map.osm.pbf
      hash: md5
      md5: 59df0d6952f0c2d7c892d74276c53a7a
      size: 5810029
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - road
            - 255
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.4769
          - 55.62708
          - 37.65942
          - 55.704
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: ccd91be116d68c2d51079062b3965f74.dir
      size: 192987804
      nfiles: 150
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - road
            - 255
          data_dir: data/satellite
          max_workers: 4
          zoom: 17
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.4769
          - 55.62708
          - 37.65942
          - 55.704
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/dataset
      hash: md5
      md5: 90f4337866a57f5068869463d4adf2e8.dir
      size: 2757648240
      nfiles: 30
  training:
    cmd: python src/train.py
    deps:
    - path: data/dataset
      hash: md5
      md5: 90f4337866a57f5068869463d4adf2e8.dir
      size: 2757648240
      nfiles: 30
    params:
      params.yaml:
        training:
          random_seed: 42
          checkpoint_dir: data/checkpoint
          classes: ${prepare_satellite_data.classes}
          num_epoch: 15
          loader:
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.7
            val_ratio: 0.15
            test_ratio: 0.15
            batch_size: 1
            num_workers: 4
            image_size: 256
          model:
            loss: mIoU
            cuda: true
            num_classes: 2
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.01
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
