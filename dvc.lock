schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: "wget -c --limit-rate=10M -P data/  \"https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf\"\
      \ && osmium extract --bbox  \"37.53325,55.67991,37.56311,55.70855\" data/central-fed-district-latest.osm.pbf\
      \  --output data/map.osm.pbf\n"
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.53325
        - 55.67991
        - 37.56311
        - 55.70855
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: 4194bad2ad76277d77ef5462e2f11e5f
      size: 865654003
    - path: data/map.osm.pbf
      hash: md5
      md5: b55ddc943e6e9f63e6a9d6e44b33675a
      size: 580462
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    deps:
    - path: data/map.osm.pbf
      hash: md5
      md5: b55ddc943e6e9f63e6a9d6e44b33675a
      size: 580462
    - path: scripts/prepare_satellite_data.py
      hash: md5
      md5: 237bb72d245b2c6d292cfda5651961dd
      size: 13155
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 153
          data_dir: data/satellite
          max_workers: 8
          zoom: 19
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.53325
          - 55.67991
          - 37.56311
          - 55.70855
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: dbda07085ce407765892875ca5e03972.dir
      size: 115411288
      nfiles: 140
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    deps:
    - path: data/satellite
      hash: md5
      md5: dbda07085ce407765892875ca5e03972.dir
      size: 115411288
      nfiles: 140
    - path: scripts/prepare_dataset.py
      hash: md5
      md5: 94d89c905534cfacab90941368508c8a
      size: 3671
    params:
      params.yaml:
        prepare_dataset:
          satellite_dir:
            ${prepare_satellite_data.data_dir}/${prepare_satellite_data.zoom}
          dataset_dir: ${prepare_satellite_data.dataset_dir}
          max_workers: 8
          num_tiles: ${prepare_satellite_data.num_tiles}
          tile_size: ${prepare_satellite_data.tile_size}
          classes: ${prepare_satellite_data.classes}
          zoom: ${prepare_satellite_data.zoom}
    outs:
    - path: data/dataset
      hash: md5
      md5: 6af2a8909ae8b5ec59ee99767a234fdb.dir
      size: 2573809056
      nfiles: 28
  training:
    cmd: python src/train.py
    deps:
    - path: src/loader.py
      hash: md5
      md5: ae1ec74bd82aa9ad677391ad1425d5c9
      size: 7348
    - path: src/train.py
      hash: md5
      md5: 92aa3c2d76c42615097f2a3417913334
      size: 1301
    params:
      params.yaml:
        training:
          random_seed: 42
          logs_dir: data/logs
          classes: ${prepare_satellite_data.classes}
          num_epoch: 1
          loader:
            model: ${training.model.type}
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.7
            val_ratio: 0.15
            test_ratio: 0.15
            keep_split: data/dataset/data_split_flags.json
            batch_size: 1
            num_workers: 8
            image_size: 256
          model:
            type: unet50
            loss: mIoU
            metric: miou
            cuda: true
            num_classes: 3
            opt:
              lr: 0.001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.0001
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
    outs:
    - path: data/logs/DvcLiveLogger/model_training/checkpoints/
      hash: md5
      md5: 08198c1ffc2f3926fa8805ff43821a64.dir
      size: 456778092
      nfiles: 1
    - path: data/logs/dvclive/artifacts/
      hash: md5
      md5: 08198c1ffc2f3926fa8805ff43821a64.dir
      size: 456778092
      nfiles: 1
    - path: data/logs/dvclive/metrics.json
      hash: md5
      md5: 28c8b66721052ff7702af3c4f06efc67
      size: 268
    - path: data/logs/dvclive/plots/metrics
      hash: md5
      md5: 24134a7991b1992d0f9ca2ec4b6f2a9f.dir
      size: 194
      nfiles: 6
  evaluate:
    cmd: python src/evaluate.py
