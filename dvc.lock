schema: '2.0'
stages:
  download_and_extract_osm:
    cmd: "wget -c --limit-rate=10M -P data/  \"https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf\"\
      \ && osmium extract --bbox  \"37.53891,55.71241,37.71109,55.78256\" data/central-fed-district-latest.osm.pbf\
      \  --output data/map.osm.pbf\n"
    params:
      params.yaml:
        prepare_satellite_data.map_box:
        - 37.53891
        - 55.71241
        - 37.71109
        - 55.78256
        prepare_satellite_data.osm: data/map.osm.pbf
    outs:
    - path: data/central-fed-district-latest.osm.pbf
      hash: md5
      md5: 1a36bfee26df9126cdcc4b822567ebcc
      size: 864721076
    - path: data/map.osm.pbf
      hash: md5
      md5: f2f1a10e946c45c51c95720ab3ffb822
      size: 14598229
  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    deps:
    - path: data/map.osm.pbf
      hash: md5
      md5: f2f1a10e946c45c51c95720ab3ffb822
      size: 14598229
    - path: scripts/prepare_satellite_data.py
      hash: md5
      md5: 237bb72d245b2c6d292cfda5651961dd
      size: 13155
    params:
      params.yaml:
        prepare_satellite_data:
          classes:
          - - building
            - 255
          - - road
            - 153
          data_dir: data/satellite
          max_workers: 4
          zoom: 19
          num_tiles: 10
          tile_size: 256
          dataset_dir: data/dataset
          map_box:
          - 37.53891
          - 55.71241
          - 37.71109
          - 55.78256
          osm: data/map.osm.pbf
          sources:
            google: http://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}
            bing: http://a0.ortho.tiles.virtualearth.net/tiles/a{}.jpeg?g=2
            arcgis:
              https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
            yandex: https://sat04.maps.yandex.net/tiles?l=sat&x={x}&y={y}&z={z}
    outs:
    - path: data/satellite
      hash: md5
      md5: aeb142552f40d669ba64814b26d3e276.dir
      size: 1845320789
      nfiles: 2250
  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    deps:
    - path: data/satellite
      hash: md5
      md5: aeb142552f40d669ba64814b26d3e276.dir
      size: 1845320789
      nfiles: 2250
    - path: scripts/prepare_dataset.py
      hash: md5
      md5: 94d89c905534cfacab90941368508c8a
      size: 3671
    params:
      params.yaml:
        prepare_dataset:
          satellite_dir:
            ${prepare_satellite_data.data_dir}/${prepare_satellite_data.zoom}
          dataset_dir: ${prepare_satellite_data.dataset_dir}
          max_workers: 4
          num_tiles: ${prepare_satellite_data.num_tiles}
          tile_size: ${prepare_satellite_data.tile_size}
          classes: ${prepare_satellite_data.classes}
          zoom: ${prepare_satellite_data.zoom}
    outs:
    - path: data/dataset
      hash: md5
      md5: 5ac9ed8efb79a5e07b41b294568f4f7e.dir
      size: 41364788400
      nfiles: 450
  training:
    cmd: python src/train.py
    deps:
    - path: data/dataset
      hash: md5
      md5: c225354e7fd6a13cfdda64ba492b2362.dir
      size: 2206122848
      nfiles: 25
    - path: src/loader.py
      hash: md5
      md5: 1a6b722ff757e80100361455742fcf03
      size: 9983
    - path: src/train.py
      hash: md5
      md5: 4e59177a8632e334acc5a0d30105336e
      size: 1615
    params:
      params.yaml:
        training:
          random_seed: 42
          logs_dir: data/logs
          classes: ${prepare_satellite_data.classes}
          num_epoch: 1
          loader:
            version: 1
            dataset_dir: ${prepare_dataset.dataset_dir}
            train_ratio: 0.8
            val_ratio: 0.1
            test_ratio: 0.1
            keep_split: data/dataset/data_split_flags.json
            batch_size: 1
            num_workers: 4
            image_size: 256
          model:
            loss: mIoU
            metric: miou
            cuda: true
            num_classes: 3
            opt:
              lr: 0.0001
              betas:
              - 0.9
              - 0.999
              eps: 1e-08
              weight_decay: 0.0001
            sch:
              num_epoch: ${training.num_epoch}
              eta_min: 1e-06
    outs:
    - path: data/logs/DvcLiveLogger/model_training/checkpoints/
      hash: md5
      md5: f1f798d114aa5499b5e3b0370befe2fa.dir
      size: 456777452
      nfiles: 1
    - path: data/logs/dvclive/artifacts/
      hash: md5
      md5: f1f798d114aa5499b5e3b0370befe2fa.dir
      size: 456777452
      nfiles: 1
    - path: data/logs/dvclive/metrics.json
      hash: md5
      md5: ee35218643b88b0f43c429ae44feec67
      size: 268
    - path: data/logs/dvclive/plots/metrics
      hash: md5
      md5: 0ce70dcdbabaa98c964e7649c6dcf42f.dir
      size: 182
      nfiles: 6
  evaluate:
    cmd: python src/eval.py
    deps:
    - path: data/dataset/data_split_flags.json
      hash: md5
      md5: 6dd7f9c79954586d42dfab9c7f9aff3b
      size: 800
    - path: src/eval.py
      hash: md5
      md5: 00116705aa91d429fde8a70b73e7ea12
      size: 3766
    outs:
    - path: data/predict/
      hash: md5
      md5: e3d382963d513c00c479441074089112.dir
      size: 4531690
      nfiles: 9
