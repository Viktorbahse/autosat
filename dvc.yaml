stages:
  download_and_extract_osm:
    cmd: wget -c --limit-rate=10M -P data/
      "https://download.geofabrik.de/russia/central-fed-district-latest.osm.pbf"
      && osmium extract --bbox
      "${prepare_satellite_data.map_box[0]},${prepare_satellite_data.map_box[1]},${prepare_satellite_data.map_box[2]},${prepare_satellite_data.map_box[3]}"
      data/central-fed-district-latest.osm.pbf --output
      ${prepare_satellite_data.osm}
    outs:
    - data/central-fed-district-latest.osm.pbf
    - ${prepare_satellite_data.osm}
    params:
    - prepare_satellite_data.map_box
    - prepare_satellite_data.osm

  prepare_satellite_data:
    cmd: python scripts/prepare_satellite_data.py
    outs:
    - ${prepare_satellite_data.data_dir}
    params:
    - prepare_satellite_data

  prepare_dataset:
    cmd: python scripts/prepare_dataset.py
    outs:
    - ${prepare_satellite_data.dataset_dir}
    params:
    - prepare_satellite_data

  training:
    cmd: python src/train.py
    deps:
    - ${prepare_dataset.dataset_dir}
    params:
    - training
metrics:
- dvclive/metrics.json
- data/logs/metrics.json
- data/logs/dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
- data/logs/plots/metrics:
    x: step
- data/logs/dvclive/plots/metrics:
    x: step
artifacts:
  best:
    path: data/logs/dvclive/artifacts/epoch=3-step=1400.ckpt
    type: model
